name: NxNative - Auto IPA Builder

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: "Ссылка на базовую игру (.nsp/.xci/.nsz или архив) [Оставьте пустым, если используете Secrets]"
        required: false
        type: string
      update_url:
        description: "Ссылка на патч/обновление (.nsp) [Опционально]"
        required: false
        type: string
      dlc_url:
        description: "Ссылка на DLC (.nsp или архив со всеми DLC) [Опционально]"
        required: false
        type: string
      keys_url:
        description: "Ссылка на файл prod.keys [Оставьте пустым, если используете Secrets]"
        required: false
        type: string
      extra_flags:
        description: "Доп. флаги сборки (например: --romfs separate или -l ru)"
        required: false
        default: ""
        type: string
      allow_other_metal:
        description: "Разрешить сборку с текущей версией Metal в облаке (--allow-other-metal)"
        required: false
        default: true
        type: boolean

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Клонирование официального репозитория seedds/nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          fetch-depth: 1

      - name: Патч совместимости MetalFX (nvn_mtl.m) с SDK GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import re, sys, pathlib

          files = list(pathlib.Path(".").rglob("nvn_mtl.m"))
          if not files:
              print("::error::Файл nvn_mtl.m не найден в репозитории!")
              sys.exit(1)

          total_patched = 0
          for p in files:
              text = p.read_text(encoding="utf-8")
              # Комментируем все обращения вида sc.*OffsetX = ...; и sc.*OffsetY = ...;
              patched, count = re.subn(
                  r'(\bsc\.[A-Za-z0-9_]*Offset[XY]\s*=\s*[^;]+;)',
                  r'/* \1 */',
                  text
              )
              if count > 0:
                  p.write_text(patched, encoding="utf-8")
                  total_patched += count
                  print(f"==> Успешно пропатчено {count} свойств OffsetX/OffsetY в файле: {p}")

          if total_patched == 0:
              print("::warning::Свойства OffsetX/OffsetY не найдены регулярным выражением, проверяем строки с DLSS_...")
              for p in files:
                  lines = p.read_text(encoding="utf-8").splitlines()
                  new_lines = []
                  for line in lines:
                      if "OffsetX" in line or "OffsetY" in line:
                          new_lines.append(f"// {line}")
                          total_patched += 1
                      else:
                          new_lines.append(line)
                  p.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
                  print(f"==> Закомментировано строк напрямую: {total_patched} в {p}")
          EOF

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Установка системных зависимостей и Python-библиотек
        shell: bash
        run: |
          set -euo pipefail
          echo "==> Проверка Metal Toolchain..."
          xcodebuild -downloadComponent MetalToolchain || true

          echo "==> Установка пакетов Homebrew..."
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen zstd glslang spirv-cross p7zip

          echo "==> Создание изолированного виртуального окружения Python..."
          VENV_DIR="$RUNNER_TEMP/nx_venv"
          python3 -m venv "$VENV_DIR"
          
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"
          export PATH="$VENV_DIR/bin:$PATH"

          echo "==> Установка Python-зависимостей внутри venv..."
          "$VENV_DIR/bin/pip" install lz4 "capstone>=5,<6" fonttools nsz zbic gdown "backports.zstd; python_version < '3.14'"

      - name: Скачивание файлов игры и prod.keys
        shell: bash
        env:
          GAME_URL: ${{ inputs.game_url || secrets.GAME_URL }}
          UPDATE_URL: ${{ inputs.update_url || secrets.UPDATE_URL }}
          DLC_URL: ${{ inputs.dlc_url || secrets.DLC_URL }}
          KEYS_URL: ${{ inputs.keys_url || secrets.KEYS_URL }}
        run: |
          set -euo pipefail
          WORK_DIR="$RUNNER_TEMP/nx_work"
          GAME_DIR="$WORK_DIR/game"
          DL_DIR="$WORK_DIR/downloads"
          mkdir -p "$GAME_DIR" "$DL_DIR"

          if [[ -z "$GAME_URL" ]]; then
            echo "::error::Не указана ссылка на игру (GAME_URL)! Введите её при запуске Run workflow или добавьте в Settings -> Secrets -> Actions."
            exit 1
          fi

          if [[ -z "$KEYS_URL" ]]; then
            echo "::error::Не указана ссылка на ключи (KEYS_URL)! Введите её при запуске Run workflow или добавьте в Settings -> Secrets -> Actions."
            exit 1
          fi

          smart_download() {
            local url="$1"
            local out_path="$2"
            if [[ "$url" == *"drive.google.com"* ]]; then
              python3 - "$url" "$out_path" << 'EOF'
          import sys, os, re, gdown

          url, out = sys.argv[1].strip(), sys.argv[2].strip()

          if "/folders/" in url:
              gdown.download_folder(url=url, output=out, quiet=False)
          else:
              if os.path.isdir(out):
                  out = out.rstrip("/") + "/"
              
              m = re.search(r'(?:/d/|id=)([a-zA-Z0-9_-]{10,})', url)
              if m:
                  file_id = m.group(1)
                  dl_url = f"https://drive.google.com/uc?id={file_id}"
              else:
                  dl_url = url

              res = gdown.download(url=dl_url, output=out, quiet=False)
              if not res:
                  sys.exit(1)
          EOF
            else
              if [[ -d "$out_path" ]]; then
                (cd "$out_path" && curl -L -J -O "$url")
              else
                curl -L "$url" -o "$out_path"
              fi
            fi
          }

          download_and_extract() {
            local url="$1"
            local target_dir="$2"
            local label="$3"
            local sub_dl="$DL_DIR/$label"
            mkdir -p "$sub_dl"

            echo "==> Скачивание: $label..."
            smart_download "$url" "$sub_dl"

            shopt -s nocaseglob
            for f in "$sub_dl"/*; do
              [[ -e "$f" ]] || continue
              case "$f" in
                *.zip|*.7z|*.rar|*.tar*)
                  echo "==> Распаковка архива $f..."
                  7z x "$f" -o"$target_dir" -y
                  ;;
                *)
                  mv "$f" "$target_dir/"
                  ;;
              esac
            done
            shopt -u nocaseglob
          }

          echo "==> Скачивание prod.keys..."
          smart_download "$KEYS_URL" "$WORK_DIR/prod.keys"

          if [[ ! -s "$WORK_DIR/prod.keys" ]] \vert{}\vert{} grep -qi "<html" "$WORK_DIR/prod.keys"; then
            echo "::error::Файл prod.keys не скачался или вместо него скачалась веб-страница! Проверьте доступ 'Все, у кого есть ссылка' на Google Drive."
            exit 1
          fi

          download_and_extract "$GAME_URL" "$GAME_DIR" "base"
          
          if [[ -n "$UPDATE_URL" ]]; then
            download_and_extract "$UPDATE_URL" "$GAME_DIR" "update"
          fi

          if [[ -n "$DLC_URL" ]]; then
            download_and_extract "$DLC_URL" "$GAME_DIR" "dlc"
          fi

          find "$GAME_DIR" -mindepth 2 -type f \( -iname "*.nsp" -o -iname "*.xci" -o -iname "*.nsz" -o -iname "*.xcz" \) -exec mv {} "$GAME_DIR/" \;

          echo "==> Файлы в папке сборки:"
          ls -lh "$GAME_DIR"

      - name: Компиляция и упаковка .IPA через nxnative
        shell: bash
        env:
          EXTRA_FLAGS: ${{ inputs.extra_flags }}
          ALLOW_METAL: ${{ inputs.allow_other_metal }}
        run: |
          set -euo pipefail
          WORK_DIR="$RUNNER_TEMP/nx_work"
          GAME_DIR="$WORK_DIR/game"
          OUTPUT_IPA="$WORK_DIR/NxNative_Port.ipa"

          CMD_ARGS=("$GAME_DIR" -k "$WORK_DIR/prod.keys" -o "$OUTPUT_IPA")
          
          if [[ "$ALLOW_METAL" == "true" ]]; then
            CMD_ARGS+=(--allow-other-metal)
          fi

          if [[ -n "$EXTRA_FLAGS" ]]; then
            read -r -a EXTRA_ARR <<< "$EXTRA_FLAGS"
            CMD_ARGS+=("${EXTRA_ARR[@]}")
          fi

          echo "==> Запуск сборки: python3 scripts/build_ipa_from_nsp.py ${CMD_ARGS[*]}"
          if ! python3 scripts/build_ipa_from_nsp.py "${CMD_ARGS[@]}"; then
            echo "::error::Ошибка при сборке! Вывод логов, содержащих ошибки:"
            for logfile in "$GAME_DIR"/*_build/logs/*.log; do
              if [[ -f "$logfile" ]] && grep -qE "error:|fatal error:|Error" "$logfile"; then
                echo "==================== ОШИБКИ В $logfile ===================="
                grep -C 3 -E "error:|fatal error:" "$logfile" \vert{}\vert{} tail -n 50 "$logfile"
              fi
            done
            exit 1
          fi

          if [[ ! -s "$OUTPUT_IPA" ]]; then
            echo "::error::Сборка завершилась без создания .ipa файла!"
            exit 1
          fi

      - name: Выгрузка готового .IPA в Артефакты
